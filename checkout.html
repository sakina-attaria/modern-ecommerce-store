<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — ShopEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">Shop<span>Ease</span></a>
    <div class="search-bar">
      <input type="text" id="navSearch" placeholder="Search products...">
      <button id="navSearchBtn">🔍</button>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </nav>
    <a href="cart.html" class="cart-icon">
      🛒 <span id="cartCount" class="cart-count">0</span>
    </a>
    <button class="menu-toggle" id="menuToggle">☰</button>
  </div>
</header>

<!-- ===== CHECKOUT SECTION ===== -->
<section class="checkout-section">
  <h1>Checkout</h1>
  <div class="checkout-container">

    <form id="checkoutForm" class="checkout-form">
      <label>Full Name</label>
      <input type="text" id="custName" required>

      <label>Email</label>
      <input type="email" id="custEmail" required>

      <label>Phone Number</label>
      <input type="tel" id="custPhone" required>

      <label>Address</label>
      <input type="text" id="custAddress" required>

      <div class="form-row">
        <div>
          <label>City</label>
          <input type="text" id="custCity" required>
        </div>
        <div>
          <label>Postal Code</label>
          <input type="text" id="custPostal" required>
        </div>
      </div>

      <label>Payment Method</label>
      <select id="paymentMethod" required>
        <option value="cod">Cash on Delivery</option>
        <option value="card">Credit/Debit Card</option>
        <option value="bank">Bank Transfer</option>
      </select>

      <button type="submit" class="btn-primary place-order-btn">Place Order</button>
    </form>

    <div class="order-summary" id="orderSummary">
      <!-- JS injects order summary here -->
    </div>

  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="footer-container">
    <div class="footer-col">
      <h3>ShopEase</h3>
      <p>Your trusted online shopping destination.</p>
    </div>
    <div class="footer-col">
      <h4>Quick Links</h4>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </div>
    <div class="footer-col">
      <h4>Contact</h4>
      <p>Email: support@shopease.com</p>
      <p>Phone: +92 300 1234567</p>
    </div>
  </div>
  <p class="footer-bottom">© 2026 ShopEase. All rights reserved.</p>
</footer>

<script src="js/products-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
